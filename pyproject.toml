[project]
name = "softk"
version = "0.0.0"
description = "Annealed soft top-k softmax for PyTorch"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
demo = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/softk"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "matplotlib>=3.10.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a few seconds (deselect with -m 'not slow')",
    "gpu: needs a CUDA GPU; skipped when none is present",
]
